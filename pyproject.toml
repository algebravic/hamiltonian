[project]
name = "hamiltonian"
version = "1.0.0"
description = ""
authors = [{ name = "Victor S. Miller", email = "victorsmiller@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "networkx>=3.4.2,<4",
    "graphillion",
    "python-sat~=1.8.dev13",
    "separation",
    "cffi>=2.0.0",
    "matplotlib>=3.10.8",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "pandas>=3.0.2",
    "graph-families",
    "kobayashi-pw",
    "numpy",
]

[project.scripts]
tours = "hamiltonian.run:run_tours"
write = "hamiltonian.run:write_graph"
count = "hamiltonian.claude.ham_count:main"
analysis = "hamiltonian.claude.profile_analysis:main"
fit-work-model = "hamiltonian.claude.work_model:main"

[dependency-groups]
dev = ["pytest>=5.2"]

[tool.uv]

[tool.uv.sources]
graphillion = { git = "https://github.com/takemaru/graphillion.git", rev = "v2.0rc0" }
separation = { git = "https://github.com/algebravic/separation.git" }
graph-families = { git = "https://github.com/algebravic/graph_families.git" }
kobayashi-pw = { path = "../kobayashi-pw", editable = true }
# Once kobayashi-pw is on GitHub, a pinned git source works the same way: its C
# programs are compiled on first use (kobayashi_pw.native), so no build step is needed.
# kobayashi-pw = { git = "https://github.com/algebravic/kobayashi-pw.git", rev = "<tag or commit>" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
